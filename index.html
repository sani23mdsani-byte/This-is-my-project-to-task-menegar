<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task menager</title>
</head>
    <style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');
body{
   background-color: #0f172a;
    color: #f8fafc;
    font-family: 'Hind Siliguri', 'Poppins', sans-serif;
    margin: 0;
    padding: 20px;
}
.header{
 background:linear-gradient(135deg, #1e293b, #0f172a);
  padding: 10px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);  
}
.header h1{
   color: #38bdf8;
  font-size: 36px;
  margin: 0 0 10px 0;
}
.header h2{
   background: rgba(52, 211, 153, 0.1);
  padding: 15px 20px;
 display: inline-block;
  border-radius: 12px;
}
.body{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 10px;
  margin-top: 20px;
}
.task-list{
   background: #1e293b;
  padding: 25px;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 15px;
}
.start-date, .add-task{
  background: #1e293b;
  padding: 25px;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 15px;
}
.start-date h2, .add-task h1, .task-list h1{
  color: #f1f5f9;
  font-size: 23px;
  border-bottom: 2px solid #38bdf8;
  padding-bottom: 8px;
  color: #f1f5f9;
  display: inline-block;
}
.date-box{
  background: #0f172a;
  color: #fbbf24;;
  padding: 15px;
  border-radius: 9px;
  margin-top: 10px;
  font-size: 25px;
  font-weight: 600;
  width: 92%;
  text-align: center;
} 
input{
  border: none;
  outline: none;
  padding: 8px;
  border-radius: 6px;
  width: 96%;
  background: #0f172a;
  color: #fff;
  border: 1px solid #334155;
  font-size: 16px;
  font-weight: poppins;
  margin-top: 10px;
  margin-bottom: 10px;
}
input:focus{
  border-color: #38bdf8;
}
.add-btn{
  padding: 9px;
  border-radius: 7px;
  width: 100%;
  border: none;
  outline: none;
  font-weight: 600;
  font-size: 16px;
  background: #38bdf8;
  color: #0f172a;
  cursor: pointer;
  transition: 0.3s ease;
}
.add-btn:hover{
  opacity: 0.7;
} 
.task-li{
  background: #0f172a;
  color: white;
  border-left: 4px solid #38bdf8;
  padding: 14px 19px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  border-radius: 9px;
  margin-bottom: 20px;
  margin-rigth: 100px;
}</style>
<body>
  <div class="full-card">
    <div class="header">
    <h1>My Goal Target</h1>
    <h2> 🎯 3Years target</h2>
    </div>
    <form class="body">
      <div class="start-date">
        <h2>Start Date to Our mission</h2><br>
        <div class="date-box">Nov 1, 2026</div>
        <h2>Finish Date to Our mission</h2><br>
        <div class="date-box">Nov 1, 2029</div>
      </div>
      <div class="add-task">
        <h1>Add Our Mission</h1>
        <input type="text" placeholder="Life Ja korte Hbe" id="taskInput" required>
        <input type="date" id="dateInput" required>
        <button type="submit" class="add-btn" onclick="addtaskBtn(event)">Task Save koro</button>
      </div>
    </form>
    <div class="task-list">
      <h1>Amar Daily Tasks</h1>
      <ul id="task-list">
      </ul>
      <div>
  </div>
    </div>
      <script>const taskInput = document.getElementById("taskInput");
const dataInput = document.getElementById("dateInput");
const Ul = document.getElementById("task-list");

// 1. LocalStorage theke ager task gulo load korar jonno
let tasks = JSON.parse(localStorage.getItem("my-tasks")) || [];

// Page load howar sathe sathe ager task gulo screen-e dekhanor function
function renderTasks() {
    Ul.innerHTML = "";
    tasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.classList.add("task-li");
        
        li.innerHTML = `
            <span>${task.text}</span>
            <span style="font-size: 16px; color: #aaa; margin-left: 10px;">(${task.date})</span>
            <button onclick="deleteTask(${index})" style="background: red; color: black; border: none; padding: 9px; border-radius: 9px; cursor: pointer; font-weight: 600;">Delet</button>
        `;
        Ul.appendChild(li);
    });
} 

// 2. Notun task add korar function
function addtaskBtn(event){
    event.preventDefault(event);
    const taskText = taskInput.value;
    const taskData = dataInput.value; 
    
    if(taskText === "" || taskData === ""){
        alert("Bul hoiche age amake task ar date dite Hobe"); 
        return; 
    }
    
    // Notun task object baniye array-te push kora
    const newTask = { text: taskText, date: taskData };
    tasks.push(newTask);
    
    // LocalStorage-e save kora
    localStorage.setItem("my-tasks", JSON.stringify(tasks));
    
    // Screen-e update task list dekhano
    renderTasks();
    
    taskInput.value = "";
    dataInput.value = "";
}

// 3. Task delete korar function
function deleteTask(index) {
    tasks.splice(index, 1); // Array theke bad dewa
    localStorage.setItem("my-tasks", JSON.stringify(tasks)); // LocalStorage update kora
    renderTasks();
}

// Page load holei task gulo show korbe
renderTasks();</script>
</body>
</html>
